name: covenant-watch-preprod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    build:
      context: .
      target: production
    environment:
      NEXT_PUBLIC_APP_MODE: midnight
      COVENANT_ADAPTER: midnight
      MIDNIGHT_NETWORK_ID: preprod
      MIDNIGHT_INDEXER_URL: https://indexer.preprod.midnight.network/api/v4/graphql
      MIDNIGHT_INDEXER_WS_URL: wss://indexer.preprod.midnight.network/api/v4/graphql/ws
      MIDNIGHT_NODE_URL: https://rpc.preprod.midnight.network
      MIDNIGHT_NODE_WS_URL: wss://rpc.preprod.midnight.network
      MIDNIGHT_PROOF_SERVER_URL: http://proof-server:6300
      MIDNIGHT_WALLET_SEED: ${MIDNIGHT_WALLET_SEED:?Set MIDNIGHT_WALLET_SEED in .env.preprod}
      MIDNIGHT_PRIVATE_STATE_PASSWORD: ${MIDNIGHT_PRIVATE_STATE_PASSWORD:?Set MIDNIGHT_PRIVATE_STATE_PASSWORD in .env.preprod}
      COVENANT_RUNTIME_DIR: /app/.covenant-runtime
      COVENANT_ENABLE_OPERATOR_HTTP: "false"
    ports:
      - "127.0.0.1:${COVENANT_WEB_PORT:-9923}:3000"
    volumes:
      - covenant_preprod_runtime:/app/.covenant-runtime
    depends_on:
      proof-server:
        condition: service_healthy
    init: true
    restart: unless-stopped
    logging: *default-logging

  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ["midnight-proof-server", "-v"]
    environment:
      RUST_BACKTRACE: full
    expose:
      - "6300"
    ports:
      - "127.0.0.1:${COVENANT_PROOF_PORT:-16300}:6300"
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/6300"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    init: true
    restart: unless-stopped
    logging: *default-logging

  wallet-tool:
    profiles: ["tools"]
    build:
      context: .
      target: development
    environment:
      MIDNIGHT_NETWORK_ID: preprod
      MIDNIGHT_INDEXER_URL: https://indexer.preprod.midnight.network/api/v4/graphql
      MIDNIGHT_INDEXER_WS_URL: wss://indexer.preprod.midnight.network/api/v4/graphql/ws
      MIDNIGHT_NODE_URL: https://rpc.preprod.midnight.network
      MIDNIGHT_NODE_WS_URL: wss://rpc.preprod.midnight.network
      MIDNIGHT_PROOF_SERVER_URL: http://proof-server:6300
      MIDNIGHT_WALLET_SEED: ${MIDNIGHT_WALLET_SEED:?Set MIDNIGHT_WALLET_SEED in .env.preprod}
      COVENANT_RUNTIME_DIR: /workspace/.covenant-runtime
    volumes:
      - ./.covenant-runtime:/workspace/.covenant-runtime
    depends_on:
      proof-server:
        condition: service_healthy
    command: ["node", "--import", "./scripts/node-websocket-polyfill.mjs", "--import", "tsx", "scripts/preprod-wallet.ts", "register"]
    init: true
    logging: *default-logging

volumes:
  covenant_preprod_runtime:

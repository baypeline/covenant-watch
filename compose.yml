name: covenant-watch

services:
  web:
    build:
      context: .
      target: production
    environment:
      NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-demo}
      COVENANT_ADAPTER: ${COVENANT_ADAPTER:-demo}
      MIDNIGHT_NETWORK_ID: ${MIDNIGHT_NETWORK_ID:-undeployed}
      MIDNIGHT_INDEXER_URL: ${MIDNIGHT_INDEXER_URL:-http://indexer:8088/api/v4/graphql}
      MIDNIGHT_INDEXER_WS_URL: ${MIDNIGHT_INDEXER_WS_URL:-ws://indexer:8088/api/v4/graphql/ws}
      MIDNIGHT_NODE_URL: ${MIDNIGHT_NODE_URL:-http://node:9944}
      MIDNIGHT_NODE_WS_URL: ${MIDNIGHT_NODE_WS_URL:-ws://node:9944}
      MIDNIGHT_PROOF_SERVER_URL: ${MIDNIGHT_PROOF_SERVER_URL:-http://proof-server:6300}
      MIDNIGHT_CONTRACT_ADDRESS: ${MIDNIGHT_CONTRACT_ADDRESS:-}
      MIDNIGHT_WALLET_SEED: ${MIDNIGHT_WALLET_SEED:-}
      MIDNIGHT_PRIVATE_STATE_PASSWORD: ${MIDNIGHT_PRIVATE_STATE_PASSWORD:-}
      COVENANT_RUNTIME_DIR: /app/.covenant-runtime
    ports:
      - "${COVENANT_WEB_PORT:-9923}:3000"
    volumes:
      - covenant_runtime:/app/.covenant-runtime
    depends_on:
      indexer:
        condition: service_healthy
      proof-server:
        condition: service_healthy
    restart: unless-stopped

  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ["midnight-proof-server", "-v"]
    environment:
      RUST_BACKTRACE: full
    ports:
      - "127.0.0.1:${COVENANT_PROOF_PORT:-16300}:6300"
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/6300"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    restart: on-failure:10
    ports:
      - "127.0.0.1:${COVENANT_INDEXER_PORT:-18088}:8088"
    environment:
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__NODE__URL: ws://node:9944
      APP__INFRA__STORAGE__PASSWORD: indexer
      APP__INFRA__PUB_SUB__PASSWORD: indexer
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: indexer
      APP__INFRA__SECRET: "303132333435363738393031323334353637383930313233343536373839303132"
      APP__INFRA__SPO_NODE__URL: ws://node:9944
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: e2e-test-dummy-id
      RUST_LOG: indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: midnightntwrk/midnight-node:1.0.0
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
    ports:
      - "127.0.0.1:${COVENANT_NODE_PORT:-19944}:9944"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -X POST -H "Content-Type: application/json"
          -d '{"jsonrpc":"2.0","id":1,"method":"chain_getBlockHash","params":[1]}'
          http://localhost:9944 | grep -q '"result":"0x'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  covenant_runtime:

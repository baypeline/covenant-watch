name: covenant-watch

services:
  web:
    build:
      context: .
      target: production
    environment:
      NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-demo}
      MIDNIGHT_NETWORK_ID: ${MIDNIGHT_NETWORK_ID:-undeployed}
      MIDNIGHT_INDEXER_URL: ${MIDNIGHT_INDEXER_URL:-http://indexer:8088/api/v3/graphql}
      MIDNIGHT_NODE_URL: ${MIDNIGHT_NODE_URL:-ws://node:9944}
      MIDNIGHT_PROOF_SERVER_URL: ${MIDNIGHT_PROOF_SERVER_URL:-http://proof-server:6300}
      MIDNIGHT_CONTRACT_ADDRESS: ${MIDNIGHT_CONTRACT_ADDRESS:-}
    ports:
      - "3000:3000"
    depends_on:
      indexer:
        condition: service_healthy
      proof-server:
        condition: service_started
    restart: unless-stopped

  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ["midnight-proof-server -v"]
    environment:
      RUST_BACKTRACE: full
    ports:
      - "127.0.0.1:6300:6300"

  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    restart: on-failure:10
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__NODE__URL: ws://node:9944
      RUST_LOG: indexer=info,chain_indexer=info,wallet_indexer=info,indexer_common=info
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      node:
        condition: service_healthy

  node:
    image: midnightntwrk/midnight-node:1.0.0
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
    ports:
      - "127.0.0.1:9944:9944"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
